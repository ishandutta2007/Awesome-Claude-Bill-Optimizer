<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Animations -->
    <style>
      .glow-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .orbit-slow {
        animation: orbit 20s linear infinite;
        transform-origin: 600px 180px;
      }
      .float-pill-1 {
        animation: float1 5s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: float2 6s ease-in-out infinite alternate;
      }
      .float-pill-3 {
        animation: float3 5.5s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: dash 15s linear infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.96); }
        100% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes float1 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-12px) translateX(6px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(14px) translateX(-8px); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-15px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -400; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Animated Ambient Blobs (Background Behind Text) -->
  <g class="glow-pulse" style="transform-origin: 300px 140px;">
    <circle cx="300" cy="140" r="140" fill="#d97706" opacity="0.15" filter="blur(50px)" />
  </g>
  <g class="glow-pulse" style="transform-origin: 900px 220px; animation-delay: -2s;">
    <circle cx="900" cy="220" r="150" fill="#8b5cf6" opacity="0.18" filter="blur(55px)" />
  </g>
  <g class="glow-pulse" style="transform-origin: 600px 280px; animation-delay: -1s;">
    <circle cx="600" cy="280" r="130" fill="#06b6d4" opacity="0.12" filter="blur(45px)" />
  </g>

  <!-- Decorative Orbiting Tech Rings / Circuit Streams -->
  <g opacity="0.25">
    <circle cx="600" cy="180" r="280" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 10" class="stream-line" />
    <circle cx="600" cy="180" r="320" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" />
  </g>

  <!-- Floating Dynamic Tech Badges/Pills (Positioned Safely to Sides) -->
  <!-- Left Side Badges -->
  <g class="float-pill-1">
    <g transform="translate(60, 60)">
      <rect width="180" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#38bdf8" />
      <text x="38" y="24" fill="#93c5fd" class="tag-text">Context Pruning</text>
    </g>
  </g>

  <g class="float-pill-2">
    <g transform="translate(50, 260)">
      <rect width="210" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#34d399" />
      <text x="38" y="24" fill="#6ee7b7" class="tag-text">⚡ 60-90% Cost Cut</text>
    </g>
  </g>

  <!-- Right Side Badges -->
  <g class="float-pill-3">
    <g transform="translate(950, 70)">
      <rect width="190" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#c084fc" />
      <text x="38" y="24" fill="#d8b4fe" class="tag-text">AST Graph Queries</text>
    </g>
  </g>

  <g class="float-pill-1">
    <g transform="translate(960, 250)">
      <rect width="180" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#fbbf24" />
      <text x="38" y="24" fill="#fde68a" class="tag-text">Prompt Caching</text>
    </g>
  </g>

  <!-- Central Foreground Content (Unobscured & Crystal Clear) -->
  <g transform="translate(600, 120)" text-anchor="middle">
    <!-- Top Micro Tag -->
    <rect x="-140" y="-45" width="280" height="28" rx="14" fill="#312e81" fill-opacity="0.6" stroke="#6366f1" stroke-width="1" />
    <text x="0" y="-27" fill="#c7d2fe" class="tag-text" font-size="12">AI AGENT TOKEN &amp; COST ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="42" fill="#ffffff" font-size="52" class="title-text">
      Claude Bill Optimizer
    </text>

    <!-- Gradient Underline Accent -->
    <rect x="-160" y="62" width="320" height="4" rx="2" fill="url(#primaryGlow)" />

    <!-- Subtitle / Tagline -->
    <text x="0" y="96" fill="#94a3b8" font-size="19" class="sub-text">
      The Ultimate Directory of Token Compression, AI Gateways &amp; Cost Reduction Systems
    </text>

    <text x="0" y="128" fill="#64748b" font-size="14" class="sub-text">
      Curated Open-Source Frameworks &amp; Enterprise SaaS for Claude Code, Cursor, Codex &amp; Copilot
    </text>
  </g>
</svg>
